<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Part 1</title>
</head>
<body>
  <h1>Contact Form</h1>
  <form>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name"><br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br><br>
    <label for="message">Message:</label><br>
    <textarea id="message" name="message"></textarea><br><br>
    <button type="submit">Submit</button>
  </form>

  <h1>HTML5 Validation</h1>
  <form>
    <label for="name2">Name:</label>
    <input type="text" id="name2" name="name" required minlength="2" maxlength="50"><br><br>
    <label for="email2">Email:</label>
    <input type="email" id="email2" name="email" required><br><br>
    <label for="message2">Message:</label><br>
    <textarea id="message2" name="message" required maxlength="500"></textarea><br><br>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
