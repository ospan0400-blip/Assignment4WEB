<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Part 3</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h1>Registration Form</h1>
    <form id="registrationForm">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="firstName" class="form-label">First Name</label>
          <input type="text" class="form-control" id="firstName" required>
          <div class="invalid-feedback">Enter your first name.</div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="lastName" class="form-label">Last Name</label>
          <input type="text" class="form-control" id="lastName" required>
          <div class="invalid-feedback">Enter your last name.</div>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
        <div class="invalid-feedback">Enter a valid email.</div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" minlength="8" required>
          <div class="invalid-feedback">Password needs at least 8 characters.</div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" required>
          <div class="invalid-feedback">Passwords must match.</div>
        </div>
      </div>

      <p>Gender:</p>
      <div class="form-check form-check-inline">
        <input type="radio" class="form-check-input" id="female" name="gender" required>
        <label for="female" class="form-check-label">Female</label>
      </div>
      <div class="form-check form-check-inline">
        <input type="radio" class="form-check-input" id="male" name="gender">
        <label for="male" class="form-check-label">Male</label>
      </div>
      <div class="form-check form-check-inline">
        <input type="radio" class="form-check-input" id="other" name="gender">
        <label for="other" class="form-check-label">Other</label>
      </div>

      <div class="my-3">
        <p>Hobbies:</p>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="reading">
          <label for="reading" class="form-check-label">Reading</label>
        </div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="sports">
          <label for="sports" class="form-check-label">Sports</label>
        </div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="music">
          <label for="music" class="form-check-label">Music</label>
        </div>
      </div>

      <div class="mb-3">
        <label for="country" class="form-label">Country</label>
        <select class="form-select" id="country" required>
          <option value="">Choose a country</option>
          <option>Kazakhstan</option>
          <option>USA</option>
          <option>UK</option>
          <option>Other</option>
        </select>
        <div class="invalid-feedback">Choose a country.</div>
      </div>

      <button type="submit" class="btn btn-primary">Register</button>
      <button type="reset" class="btn btn-secondary">Reset</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('registrationForm');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      if (password.value !== confirmPassword.value) {
        confirmPassword.setCustomValidity('Passwords do not match');
      } else {
        confirmPassword.setCustomValidity('');
      }

      form.querySelectorAll('input, select').forEach(function (field) {
        if (field.checkValidity()) {
          field.classList.add('is-valid');
          field.classList.remove('is-invalid');
        } else {
          field.classList.add('is-invalid');
          field.classList.remove('is-valid');
        }
      });
    });
  </script>
</body>
</html>
