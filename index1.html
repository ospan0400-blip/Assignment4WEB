<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Part 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h1>Bootstrap Contact Form</h1>
    <form class="mb-4">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" placeholder="Your name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <hr>
    <h1>Bootstrap Validation</h1>
    <form id="validationForm" novalidate>
      <div class="mb-3">
        <label for="name3" class="form-label">Name</label>
        <input type="text" class="form-control" id="name3" required minlength="2">
        <div class="invalid-feedback">Please enter your name.</div>
        <div class="valid-feedback">Valid</div>
      </div>
      <div class="mb-3">
        <label for="email3" class="form-label">Email</label>
        <input type="email" class="form-control" id="email3" required>
        <div class="invalid-feedback">Enter a valid email.</div>
        <div class="valid-feedback">Valid</div>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('validationForm');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      form.querySelectorAll('input').forEach(function (input) {
        if (input.checkValidity()) {
          input.classList.add('is-valid');
          input.classList.remove('is-invalid');
        } else {
          input.classList.add('is-invalid');
          input.classList.remove('is-valid');
        }
      });
    });
  </script>
</body>
</html>
